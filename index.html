<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>蝦皮好物研究中心 | 嚴選平價酷東西</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #ffffff; color: #171717; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { display: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen selection:bg-neutral-900 selection:text-white">

    <header class="w-full bg-white/90 backdrop-blur-sm sticky top-0 z-40 border-b border-neutral-100 relative">
        <div class="w-full px-6 lg:px-12 h-20 flex justify-between items-center gap-4">
            <a href="#" class="shrink-0 flex items-center h-6">
                <img src="logo.png" alt="蝦皮好物研究中心 Logo" class="h-full w-auto object-contain">
            </a>
            
            <div class="flex items-center gap-4">
                <nav class="hidden md:flex gap-6">
                    <a href="#" class="text-sm font-bold text-neutral-900 hover:text-neutral-600 transition-colors">精選好物</a>
                    <a href="./disclaimer.pdf" target="_blank" class="text-sm font-bold text-neutral-400 hover:text-neutral-900 transition-colors">使用者須知</a>
                </nav>
                <div class="flex items-center gap-2 md:hidden">
                    <button id="mobileSearchBtn" class="p-2 text-neutral-900 focus:outline-none">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></svg>
                    </button>
                    <button id="mobileMenuBtn" class="p-2 text-neutral-900 focus:outline-none relative w-6 h-6">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full stroke-current stroke-2"><path d="M4 6H16" stroke-linecap="round"/><path d="M4 12H12" stroke-linecap="round"/><path d="M4 18H20" stroke-linecap="round"/></svg>
                    </button>
                </div>
            </div>
        </div>
        <div id="mobileSearchDropdown" class="hidden md:hidden absolute top-full left-0 w-full bg-white border-b border-neutral-100 shadow-lg px-6 py-4">
            <div class="relative w-full group">
                <input type="text" id="mobileSearchInput" onkeyup="handleSearch(event, this.value)" placeholder="搜尋好物..." class="w-full border-2 border-neutral-100 rounded-lg text-sm py-2.5 pl-4 pr-10 focus:outline-none focus:border-neutral-900 text-neutral-900 font-medium">
            </div>
        </div>
        <div id="mobileMenu" class="hidden md:hidden absolute top-full left-0 w-full bg-white border-b border-neutral-100 shadow-lg z-50">
            <nav class="flex flex-col px-6 py-4 gap-4">
                <a href="#" class="text-base font-bold text-neutral-900">精選好物</a>
                <a href="./disclaimer.pdf" target="_blank" class="text-base font-bold text-neutral-400">使用者須知</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-6 w-full pb-32">
        <div class="w-full pt-8 pb-8 mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-neutral-100">
            <div class="flex items-center gap-6 shrink-0">
                <span class="text-sm font-black text-neutral-900 cursor-pointer">熱度最高</span>
                <span class="text-sm font-medium text-neutral-400 hover:text-neutral-900 cursor-pointer transition-colors">最近更新</span>
            </div>
            <div class="hidden md:block w-80 relative group shrink-0">
                <input type="text" id="desktopSearchInput" onkeyup="handleSearch(event, this.value)" placeholder="搜尋好物..." class="w-full border-2 border-neutral-100 rounded-lg text-sm py-2.5 pl-4 pr-10 focus:outline-none focus:border-neutral-900 text-neutral-900 font-medium">
            </div>
        </div>

        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-6 gap-y-12">
            <div class="col-span-full flex flex-col items-center justify-center py-16">
                <div class="w-8 h-8 border-4 border-neutral-200 border-t-neutral-900 rounded-full animate-spin mb-4"></div>
                <p class="text-neutral-500 font-medium text-sm">載入中...</p>
            </div>
        </div>
    </main>

    <div id="productModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 sm:p-6 bg-black/70 backdrop-blur-sm transition-opacity duration-300 opacity-0 pointer-events-none" onclick="handleBackdropClick(event)">
        <div id="modalContent" class="relative bg-white rounded-xl shadow-2xl overflow-hidden w-full transition-transform duration-300 scale-95 flex"></div>
    </div>

    <script>
        // 🚀 執行長的專屬資料庫 API
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQGHKBfq5lf7E6AEp4yarLpPqhvUzE3rXHMPJY7bU2-h2LwIQLk3CDAx8l6kv95aG-HyCL332bSBBQX/pub?gid=0&single=true&output=csv';
        const GAS_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbw21ICqg7RSgUJswjKjSWguDwNosJ7lned_UO61EKHiDY452D_0fqGZbRaiAhcTiUrj0Q/exec';

        let products = [];
        const productGrid = document.getElementById('productGrid');
        const modal = document.getElementById('productModal');
        const modalContent = document.getElementById('modalContent');

        async function fetchProducts() {
            try {
                const response = await fetch(GOOGLE_SHEET_CSV_URL);
                const csvText = await response.text();

                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    // 🛡️ 終極防彈裝甲：自動把表頭轉成小寫並去除空白，防止 undefined 災難！
                    transformHeader: function(header) {
                        return header.toLowerCase().trim();
                    },
                    complete: function(results) {
                        products = results.data.map(row => ({
                            id: row.id,
                            type: row.type,
                            media: row.media,
                            title: row.title,
                            categories: row.categories ? row.categories.split(',').map(c => c.trim()) : [],
                            rating: parseFloat(row.rating) || 0,
                            text: row.text,
                            link: row.link,
                            clicks: parseInt(row.clicks) || 0,
                            rawIframe: row.rawiframe || row.rawIframe || '' 
                        }));

                        const sortedProducts = [...products].sort((a, b) => {
                            if (b.clicks !== a.clicks) return b.clicks - a.clicks;
                            if (b.rating !== a.rating) return b.rating - a.rating;
                            return Math.random() - 0.5;
                        });

                        renderCards(sortedProducts);
                    }
                });
            } catch (error) {
                console.error("讀取失敗:", error);
                productGrid.innerHTML = '<div class="col-span-full text-center py-16 text-neutral-500">載入失敗，請重新整理網頁。</div>';
            }
        }

        function renderCards(dataToRender) {
            productGrid.innerHTML = ''; 
            if (dataToRender.length === 0) {
                productGrid.innerHTML = '<div class="col-span-full text-center py-16 text-neutral-500">找不到商品。</div>';
                return;
            }

            dataToRender.forEach(product => {
                const videoIconHTML = product.type === 'video' ? `<div class="absolute bottom-2 right-2 text-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path fill-rule="evenodd" d="M4.5 5.653c0-1.427 1.529-2.33 2.779-1.643l11.54 6.347c1.295.712 1.295 2.573 0 3.286L7.28 19.99c-1.25.687-2.779-.217-2.779-1.643V5.653Z" clip-rule="evenodd" /></svg></div>` : '';
                
                // 😈 暗黑兵法：整張卡片都是陷阱
                const cardHTML = `
                    <article class="flex flex-col h-full group bg-white border border-neutral-200 rounded-xl overflow-hidden hover:shadow-md transition-shadow duration-300 cursor-pointer" onclick="trackClick('${product.id}'); window.open('${product.link}', '_blank');">
                        <!-- 圖片區塊 -->
                        <div class="w-full aspect-[3/2] bg-neutral-50 overflow-hidden relative border-b border-neutral-100">
                            <img src="${product.media}" alt="${product.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                            ${videoIconHTML}
                        </div>
                        
                        <!-- 內容區塊 -->
                        <div class="p-4 md:p-5 flex flex-col flex-grow">
                            <!-- 商品標題 (拿掉 hover 變色，維持原本沉穩的黑色) -->
                            <h2 class="text-base font-bold text-neutral-900 line-clamp-2 mb-4 flex-grow">${product.title}</h2>
                            
                            <!-- 底部左右分流 -->
                            <div class="flex justify-between items-end mt-auto pt-2">
                                <!-- 左下角：介紹 Icon (加入 event.stopPropagation() 防護罩，點擊只開介紹不跳轉) -->
                                <button onclick="event.stopPropagation(); openModal('${product.id}')" class="text-neutral-400 hover:text-neutral-900 transition-colors p-1 -ml-1 z-10" title="查看商品介紹">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                                      <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
                                    </svg>
                                </button>
                                
                                <!-- 右下角：蝦皮傳送門 (改為純文字排版，點擊事件直接由外層卡片接管) -->
                                <div class="text-sm font-medium text-neutral-900 group-hover:text-orange-500 transition-colors flex items-center gap-1 pb-1">
                                    蝦皮傳送門
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 group-hover:translate-x-1 transition-transform">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </article>
                `;
                productGrid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function trackClick(productId) {
            if (!GAS_WEBHOOK_URL) return;
            fetch(`${GAS_WEBHOOK_URL}?id=${productId}`, { mode: 'no-cors' }).catch(console.error);
        }

        fetchProducts();

        function handleSearch(event, query) {
            if (!query || !query.trim()) return renderCards(products);
            const lowerQuery = query.toLowerCase().trim();
            const filteredProducts = products.filter(p => 
                (p.title && p.title.toLowerCase().includes(lowerQuery)) || 
                (p.text && p.text.toLowerCase().includes(lowerQuery))
            );
            renderCards(filteredProducts);
        }

        function openModal(productId) {
            const data = products.find(p => p.id === productId);
            if (!data) return;

            const displayTitle = data.title || '無標題商品';
            const displayMedia = data.media || 'https://placehold.co/800x600/eeeeee/999999?text=No+Image';

            const postContentHTML = `
                <h2 class="text-2xl font-black mb-4 text-neutral-900">${displayTitle}</h2>
                <div class="text-neutral-600 text-sm leading-loose mb-8 flex-grow">${data.text || '沒有提供介紹。'}</div>
                <div class="mt-auto pt-6 border-t border-neutral-100">
                    <a href="${data.link}" target="_blank" onclick="trackClick('${data.id}')" class="block w-full bg-neutral-900 text-white font-bold py-3.5 rounded text-center hover:bg-neutral-800 transition-colors shadow-lg">前往蝦皮領取優惠</a>
                </div>
            `;
            const closeBtnHTML = `<button onclick="closeModal()" class="absolute top-4 right-4 z-50 text-neutral-400 hover:text-neutral-900 bg-white/80 hover:bg-white backdrop-blur-md p-1.5 rounded-full transition-colors shadow-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>`;

            if (data.type === 'video' && data.rawIframe) {
                modalContent.className = "relative bg-white rounded-xl shadow-2xl overflow-y-auto md:overflow-hidden transition-transform duration-300 scale-95 flex flex-col md:flex-row w-full max-w-[400px] md:max-w-none md:w-auto max-h-[90vh] md:h-[85vh]";
                const responsiveIframe = data.rawIframe.replace('<iframe', '<iframe class="absolute inset-0 w-full h-full z-20"');
                modalContent.innerHTML = `${closeBtnHTML}<div class="w-full aspect-[9/16] md:w-auto md:h-full md:aspect-[9/16] bg-black relative shrink-0 md:rounded-l-xl md:rounded-tr-none overflow-hidden">${responsiveIframe}</div><div class="w-full md:w-[360px] p-6 md:p-8 flex flex-col flex-1 bg-white">${postContentHTML}</div>`;
            } else {
                modalContent.className = "relative bg-white rounded-xl shadow-2xl overflow-hidden w-full max-w-2xl transition-transform duration-300 scale-95 flex flex-col max-h-[90vh]";
                modalContent.innerHTML = `${closeBtnHTML}<div class="w-full h-full overflow-y-auto no-scrollbar flex flex-col relative"><div class="w-full aspect-[4/3] bg-neutral-100 overflow-hidden shrink-0"><img src="${displayMedia}" class="w-full h-full object-cover" alt="${displayTitle}"></div><div class="w-full p-6 md:p-8 flex flex-col flex-grow bg-white">${postContentHTML}</div></div>`;
            }

            modal.classList.remove('hidden'); modal.classList.add('flex'); void modal.offsetWidth; 
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95'); modalContent.classList.add('scale-100');
            document.body.style.overflow = 'hidden'; 
        }

        function closeModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-100'); modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.remove('flex'); modal.classList.add('hidden');
                modalContent.innerHTML = ''; document.body.style.overflow = '';
            }, 300);
        }

        function handleBackdropClick(event) { if (event.target === modal) closeModal(); }
        document.getElementById('mobileMenuBtn').addEventListener('click', () => {
            document.getElementById('mobileMenu').classList.toggle('hidden');
            document.getElementById('mobileSearchDropdown').classList.add('hidden');
        });
        document.getElementById('mobileSearchBtn').addEventListener('click', () => {
            document.getElementById('mobileSearchDropdown').classList.toggle('hidden');
            document.getElementById('mobileMenu').classList.add('hidden');
        });
    </script>
</body>
</html>
