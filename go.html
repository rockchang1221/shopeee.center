<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ▼▼▼ 這裡換成你要在社群曝光的固定資訊 ▼▼▼ -->
    <title>我的專屬好物推薦</title>
    <meta property="og:title" content="專屬優惠好物推薦">
    <meta property="og:description" content="點擊查看詳細介紹與最新優惠資訊！">
    <meta property="og:image" content="https://你的圖片網址.jpg"> 
    <meta property="og:type" content="website">
    <!-- ▲▲▲ 這裡換成你要在社群曝光的固定資訊 ▲▲▲ -->

    <script>
        // 【重要】這裡換成你「發佈試算表為 CSV」的專屬網址
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTo7OsmqFpCf4y8RM_WJVyB_ZCAgTYPAv70CXuW73w0CkKmOHWP418DpBCD9xpZXVIgGmVxE5mj15Hw/pub?gid=0&single=true&output=csv";

        window.onload = async function() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");

            if (!id) {
                document.getElementById("message").innerText = "連結無效，請確認網址是否完整。";
                return;
            }

            try {
                // 抓取 CSV 檔案 (速度極快)
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                
                // 將 CSV 按行分割
                const lines = csvText.split('\n');
                let foundUrl = null;

                // 從第2行開始找 (跳過標題列)
                for (let i = 1; i < lines.length; i++) { 
                    const line = lines[i].trim();
                    if (!line) continue;
                    
                    // 尋找符合該 ID 的那一行
                    if (line.startsWith(id + ',')) {
                        // 擷取逗號後面的內容 (即 URL 部分)
                        let remainder = line.substring(id.length + 1);
                        
                        // 處理由 Google Sheets 匯出時，若網址內含逗號會自動加上雙引號的狀況
                        if (remainder.startsWith('"')) {
                            const endQuoteIdx = remainder.indexOf('"', 1);
                            foundUrl = remainder.substring(1, endQuoteIdx);
                        } else {
                            const endCommaIdx = remainder.indexOf(',');
                        // 如果後面沒有逗號(沒有日期欄位)，就整串拿來用
                        foundUrl = endCommaIdx === -1 ? remainder : remainder.substring(0, endCommaIdx);
                    }
                    break; // 找到了就停止迴圈
                }
            }

            if (foundUrl) {
                // 判斷使用者裝置
                const ua = navigator.userAgent || navigator.vendor || window.opera;
                const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
                const isAndroid = /Android/.test(ua);
                const isInApp = /Instagram|FBAN|FBAV|Threads|Line/i.test(ua); // 偵測是否在社群軟體內建瀏覽器內
                
                // 移除網址前綴 (把 https:// 拿掉，準備轉成 App 協議)
                const pureUrl = foundUrl.replace(/^https?:\/\//, '');
                let appUrl = foundUrl;

                if (isAndroid) {
                    appUrl = `intent://${pureUrl}#Intent;package=com.shopee.tw;scheme=https;end`;
                } else if (isIOS) {
                    appUrl = `shopeetw://${pureUrl}`;
                }

                // 設定按鈕的跳轉目標
                document.getElementById("app-btn").href = appUrl;
                document.getElementById("web-btn").href = foundUrl;

                // 延遲一下讓使用者看見動畫
                setTimeout(() => {
                    // 停止搞笑文案輪播
                    clearInterval(textInterval);
                    
                    // 改變文字並顯示「實體按鈕」 (防禦社群瀏覽器的攔截)
                    document.getElementById("message").innerHTML = "如果沒有自動跳轉<br><span style='font-size: 0.95rem; color: #ee4d2d;'>請點擊下方按鈕 👇</span>";
                    if (isInApp) {
                         document.getElementById("hint-text").style.display = "block";
                    }
                    document.getElementById("btn-container").style.display = "flex";

                    // 嘗試自動跳轉 (移除原本2秒自動退回網頁版的邏輯，避免在 Threads 裡蓋過 APP 喚醒)
                    if (isAndroid || isIOS) {
                        window.location.replace(appUrl);
                    } else {
                        window.location.replace(foundUrl);
                    }
                }, 800);
            } else {
                document.getElementById("message").innerText = "找不到這個商品連結喔！老闆可能下架了😭";
                document.getElementById("animation-area").innerHTML = "🤷‍♂️";
            }
        } catch (error) {
                document.getElementById("message").innerText = "網速好像有點慢，再試一次吧！";
            }
        };

        // 搞笑文案輪播邏輯
        const funnyTexts = [
            "正在翻箱倒櫃找優惠...",
            "威脅老闆給最低價中 🔪...",
            "攔截蝦皮折價券 🚀...",
            "打包完成，準備起飛！"
        ];
        let textIndex = 0;
        // 把 setInterval 存入變數，方便跳轉時停止它
        let textInterval = setInterval(() => {
            const msgEl = document.getElementById("message");
            if (msgEl && !msgEl.innerText.includes("找不到") && !msgEl.innerText.includes("無效") && !msgEl.innerText.includes("跳轉")) {
                textIndex = (textIndex + 1) % funnyTexts.length;
                msgEl.innerText = funnyTexts[textIndex];
            }
        }, 800);
    </script>
</head>
<body style="background-color: #f8fafc; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    
    <div id="animation-area" style="font-size: 4rem; display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">
        <!-- 狂奔的小人動畫 -->
        <div class="runner">🏃💨</div>
        <!-- 目標物 -->
        <div class="target">🛍️</div>
    </div>
    
    <div style="text-align: center; color: #475569; background: white; padding: 15px 30px; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); width: 80%; max-width: 350px;">
        <p id="message" style="margin: 0; font-weight: bold; font-size: 1.1rem; line-height: 1.5;">正在準備專屬優惠...</p>
        
        <!-- 手動點擊區域 (預設隱藏，跳轉時才會顯示) -->
        <div id="btn-container" style="display: none; margin-top: 15px; gap: 12px; flex-direction: column; align-items: center;">
            <!-- 蝦皮橘色大按鈕 -->
            <a id="app-btn" href="#" style="background: #ee4d2d; color: white; padding: 12px 30px; border-radius: 25px; text-decoration: none; font-weight: bold; font-size: 1.1rem; box-shadow: 0 4px 6px rgba(238,77,45,0.3); width: 100%; box-sizing: border-box;">🦐 打開蝦皮 App</a>
            <!-- 備用的網頁版連結 -->
            <a id="web-btn" href="#" style="color: #64748b; font-size: 0.9rem; text-decoration: underline;">繼續前往網頁版</a>
            <!-- 防堵終極陷阱的提示字 -->
            <p id="hint-text" style="display: none; margin: 5px 0 0 0; font-size: 0.8rem; color: #94a3b8;">💡 若按鈕無效，請點擊右上角「⋯」<br>選擇「以瀏覽器開啟」</p>
        </div>
    </div>

    <style>
        /* 小人左右來回衝刺的動畫 */
        .runner {
            animation: dash 1s infinite alternate ease-in-out;
            transform-origin: bottom center;
        }
        
        /* 目標物微微跳動吸引目光 */
        .target {
            animation: bounce 0.8s infinite alternate ease-in-out;
        }

        @keyframes dash {
            0% { transform: translateX(-30px) rotate(-10deg); }
            100% { transform: translateX(20px) rotate(10deg); }
        }

        @keyframes bounce {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-10px) scale(1.1); }
        }
    </style>
</body>
</html>
