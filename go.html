<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. 給社群平台爬蟲看的固定資訊（Open Graph 標籤） -->
    <title>專屬好物推薦</title>
    <meta property="og:title" content="專屬優惠好物推薦">
    <meta property="og:description" content="點擊查看詳細介紹與最新優惠資訊！">
    <!-- 換成你設計好的固定縮圖網址 -->
    <meta property="og:image" content="https://placehold.co/1200x630/ee4d2d/ffffff?text=Shopee+VIP+Only"> 
    <meta property="og:type" content="website">

    <script>
        // 你的 Google Sheets 發布為 CSV 的網址
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTo7OsmqFpCf4y8RM_WJVyB_ZCAgTYPAv70CXuW73w0CkKmOHWP418DpBCD9xpZXVIgGmVxE5mj15Hw/pub?gid=0&single=true&output=csv";

        // 高級感文案輪播邏輯
        const vipTexts = [
            "正在為您解析專屬優惠...",
            "正在套用隱藏版折扣...",
            "即將開啟您的專屬通道..."
        ];
        let textIndex = 0;
        let textInterval;

        // 啟動文案輪播
        function startTextAnimation() {
            textInterval = setInterval(() => {
                const msgEl = document.getElementById("message");
                if (msgEl) {
                    textIndex = (textIndex + 1) % vipTexts.length;
                    msgEl.innerText = vipTexts[textIndex];
                }
            }, 800);
        }

        // 停止文案輪播並顯示錯誤
        function showError(msg) {
            clearInterval(textInterval);
            document.getElementById("animation-area").style.display = "none";
            document.getElementById("message").innerHTML = "❌ " + msg;
            document.getElementById("message").style.color = "#e74c3c";
        }

        // 主程式：讀取 CSV 並綁定按鈕
        async function loadTargetUrl() {
            startTextAnimation();

            const params = new URLSearchParams(window.location.search);
            const targetId = params.get("id");

            if (!targetId) {
                showError("無效的專屬連結 (缺少代碼)");
                return;
            }

            try {
                // 抓取 CSV 資料
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                
                // 解析 CSV 尋找對應的連結
                const rows = csvText.split('\n');
                let foundUrl = null;
                
                // 跳過第一行標題，從 i = 1 開始找
                for (let i = 1; i < rows.length; i++) {
                    const line = rows[i].trim();
                    if (!line) continue;
                    
                    // 以逗號分割 (第一欄是ID, 第二欄是URL)
                    const firstComma = line.indexOf(',');
                    if (firstComma > -1) {
                        const id = line.substring(0, firstComma).replace(/['"]/g, '').trim();
                        if (id === targetId) {
                            const rest = line.substring(firstComma + 1);
                            const secondComma = rest.indexOf(',');
                            // 擷取第二欄網址
                            if (secondComma > -1) {
                                foundUrl = rest.substring(0, secondComma).replace(/['"]/g, '').trim();
                            } else {
                                foundUrl = rest.replace(/['"]/g, '').trim();
                            }
                            break;
                        }
                    }
                }

                if (foundUrl) {
                    // 【關鍵防護】打死不自動跳轉，只把連結綁在按鈕上
                    document.getElementById("app-btn").href = foundUrl;

                    // 延遲 0.6 秒讓使用者看到高級感的過場，再顯示按鈕
                    setTimeout(() => {
                        clearInterval(textInterval); // 停止文字輪播
                        document.getElementById("animation-area").style.display = "none"; // 隱藏轉圈圈
                        document.getElementById("message").innerHTML = "專屬通道已為您準備完畢 ✨"; // 更新提示字
                        document.getElementById("btn-container").style.display = "flex"; // 秀出按鈕
                    }, 600);
                } else {
                    showError("找不到對應的專屬連結");
                }

            } catch (error) {
                showError("系統連線異常，請稍後再試");
                console.error(error);
            }
        }

        // 確保網頁完全載入後才執行
        window.onload = loadTargetUrl;
    </script>

    <style>
        /* 高級感背景與字體 */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
        }

        /* 毛玻璃質感卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); /* 支援 iOS Safari */
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0,0,0,0.05);
            border-radius: 24px;
            padding: 40px 30px;
            width: 85%;
            max-width: 360px;
            text-align: center;
            transition: all 0.3s ease;
        }

        /* 質感載入動畫 */
        .loading-container {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
            height: 44px; /* 固定高度避免版面跳動 */
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(238, 77, 45, 0.1);
            border-top-color: #ee4d2d;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 文字樣式 */
        .status-text {
            margin: 0;
            font-weight: 600;
            font-size: 1.15rem;
            color: #2c3e50;
            letter-spacing: 0.5px;
            min-height: 28px; /* 避免文字變更時高度跳動 */
        }

        /* 按鈕容器 */
        .btn-container {
            margin-top: 24px;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 高級感漸層按鈕 */
        .premium-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #ff743a 0%, #ee4d2d 100%);
            color: white;
            padding: 16px 32px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 10px 20px -5px rgba(238, 77, 45, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        /* 按下去的回饋感 */
        .premium-btn:active {
            transform: scale(0.96);
            box-shadow: 0 5px 10px -3px rgba(238, 77, 45, 0.4);
        }

        /* 防禦提示文字 */
        .hint-text {
            margin: 0;
            font-size: 0.85rem;
            color: #8392a5;
            line-height: 1.5;
        }
        .hint-text b {
            color: #5c6b7d;
        }
    </style>
</head>
<body>
    
    <div class="glass-card">
        <!-- 質感載入動畫 -->
        <div id="animation-area" class="loading-container">
            <div class="spinner"></div>
        </div>
        
        <!-- 動態文字 -->
        <p id="message" class="status-text">準備載入中...</p>
        
        <!-- 手動點擊區域 (預設隱藏，找到網址後才會用 JS 顯示) -->
        <div id="btn-container" class="btn-container" style="display: none;">
            
            <!-- 蝦皮漸層大按鈕 (href 會在 JS 中動態寫入) -->
            <a id="app-btn" href="#" class="premium-btn">
                <span>立即前往蝦皮</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </a>
            
            <!-- 防堵 Threads 終極陷阱的提示字 -->
            <p id="hint-text" class="hint-text">
                💡 若按鈕無效，請點擊右上角「⋯」<br>選擇<b>「以 Safari 開啟」</b>
            </p>
        </div>
    </div>

</body>
</html>
